name: FutureLab V0.48 stochastic inventory benchmark
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked benchmark dependencies
        run: python -m pip install -r requirements-v48.txt
      - name: Run all regression, constraint and adapter tests
        run: python -m pytest -q
      - name: Verify prepared panel and quality manifest hashes
        run: |
          echo '1d32ccc76a7bb6df0127d0a2d32368a22b79558e33603dfb82afd65eb0293831  data/retail_panel.csv' | sha256sum --check
          echo '5a564a92ac78c8de95511862ea576aaf9aa5784572b8c732d38be78606c19d6f  data/retail_quality.json' | sha256sum --check
      - name: Run V0.48 stochastic constrained inventory benchmark
        run: |
          python src/inventory_v48.py \
            --panel data/retail_panel.csv \
            --quality data/retail_quality.json \
            --output results/v48/remote-run \
            --replications 20
      - name: Independently audit selected policies and allocation constraints
        run: python src/audit_v48.py --results results/v48/remote-run
      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: futurelab-v048-${{ github.run_id }}
          path: results/v48/remote-run/
          if-no-files-found: warn
          retention-days: 30
