name: Restore FutureLab V0.48 from verified payloads
on:
  push:
    branches:
      - 'restore/v0.48-full'
    paths:
      - 'migration/v0.48/payloads/**'
      - '.github/workflows/reconstruct-v048.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'Store compressed V0.48 payloads') || startsWith(github.event.head_commit.message, 'Repair V0.48')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconstruct and verify all 10 large files
        run: |
          python - <<'PY'
          import base64, gzip, hashlib, json
          from pathlib import Path
          root = Path("migration/v0.48/payloads")
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          def git_blob_sha(data):
              header = b"blob " + str(len(data)).encode("ascii") + b"\0"
              return hashlib.sha1(header + data).hexdigest()
          for item in manifest["files"]:
              compressed_parts = []
              for chunk in item["chunks"]:
                  p = Path(chunk["path"])
                  encoded = p.read_bytes().strip()
                  if git_blob_sha(encoded) != chunk["blob_sha"]:
                      raise SystemExit(f"chunk Git blob SHA mismatch: {p}")
                  compressed_parts.append(base64.b64decode(encoded, validate=True))
              compressed = b"".join(compressed_parts)
              if len(compressed) != item["compressed_size"]:
                  raise SystemExit(f"compressed size mismatch: {item['path']}")
              if hashlib.sha256(compressed).hexdigest() != item["compressed_sha256"]:
                  raise SystemExit(f"compressed SHA-256 mismatch: {item['path']}")
              raw = gzip.decompress(compressed)
              if len(raw) != item["original_size"]:
                  raise SystemExit(f"original size mismatch: {item['path']}")
              if hashlib.sha256(raw).hexdigest() != item["original_sha256"]:
                  raise SystemExit(f"original SHA-256 mismatch: {item['path']}")
              if git_blob_sha(raw) != item["blob_sha"]:
                  raise SystemExit(f"original Git blob SHA mismatch: {item['path']}")
              dest = Path(item["path"])
              dest.parent.mkdir(parents=True, exist_ok=True)
              dest.write_bytes(raw)
              print(f"VERIFIED {item['path']} ({len(raw)} bytes)")
          PY
      - name: Restore all 158 original paths and verify their Git blob IDs
        run: |
          python - <<'PY'
          import hashlib, json, shutil
          from pathlib import Path
          source = Path("migration/v0.48")
          manifest = Path("migration/v0.48/payloads/original_tree_manifest.jsonl")
          rows = [json.loads(line) for line in manifest.read_text(encoding="utf-8").splitlines() if line]
          if len(rows) != 158:
              raise SystemExit(f"expected 158 original paths, got {len(rows)}")
          large = {x["path"] for x in json.loads(Path("migration/v0.48/payloads/manifest.json").read_text(encoding="utf-8"))["files"]}
          def git_blob_sha(data):
              return hashlib.sha1(b"blob " + str(len(data)).encode("ascii") + b"\0" + data).hexdigest()
          for item in rows:
              dest = Path(item["path"])
              if item["path"] in large:
                  data = dest.read_bytes()
              elif item["path"].startswith(".github/workflows/"):
                  data = (source / item["path"]).read_bytes()
              else:
                  src = source / item["path"]
                  if not src.is_file():
                      raise SystemExit(f"missing archived source file: {src}")
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copyfile(src, dest)
                  data = dest.read_bytes()
              if git_blob_sha(data) != item["sha"]:
                  raise SystemExit(f"original Git blob mismatch: {item['path']}")
              if not item["path"].startswith(".github/workflows/"):
                  dest.chmod(0o755 if item["mode"] == "100755" else 0o644)
          print("All 158 original files verified; three root workflow files will be installed by the GitHub Git-Data API.")
          PY
      - name: Remove staging archive before testing the restored project root
        run: |
          rm -rf migration/v0.48
      - name: Run tests and independent V0.48 evidence audit
        run: |
          python -m pip install -r requirements-v48.txt
          python -m pytest -q
          python src/audit_v48.py --results results/v48/inventory
      - name: Commit the reconstructed project root without changing workflow files
        run: |
          set -euo pipefail
          rm -rf migration/v0.48
          rm -f _project.md docs/CHANGELOG.md
          git add -A
          git add -f data/retail_panel.csv data/retail_quality.json
          TREE="$(git write-tree)"
          echo "Intermediate tree (workflow files are added by the Git-Data API): $TREE"
          test "$(git ls-files | wc -l | tr -d ' ')" = "156"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Restore FutureLab V0.48 project root; workflow files pending API import"
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
