name: FutureLab V0.49 capital-aware inventory benchmark
on:
  push:
    branches:
      - research/v0.49-capital-service
    paths:
      - 'src/inventory_v49.py'
      - 'src/audit_v49.py'
      - 'tests/test_v49.py'
      - 'docs/V49_PROTOCOL.md'
      - 'requirements-v49.txt'
      - '.github/workflows/v49-benchmark.yml'
      - 'data/retail_panel.csv'
      - 'data/retail_quality.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned V0.49 dependencies
        run: python -m pip install -r requirements-v49.txt
      - name: Run full regression and V0.49 allocator tests
        run: python -m pytest -q
      - name: Verify hash-pinned prepared panel and quality manifest
        run: |
          echo '1d32ccc76a7bb6df0127d0a2d32368a22b79558e33603dfb82afd65eb0293831  data/retail_panel.csv' | sha256sum --check
          echo '5a564a92ac78c8de95511862ea576aaf9aa5784572b8c732d38be78606c19d6f  data/retail_quality.json' | sha256sum --check
      - name: Run V0.49 capital-aware constrained inventory benchmark
        run: |
          python src/inventory_v49.py \
            --panel data/retail_panel.csv \
            --quality data/retail_quality.json \
            --output results/v49/inventory \
            --replications 20
      - name: Independently audit service floors, inventory states and MILP snapshots
        run: python src/audit_v49.py --results results/v49/inventory
      - name: Upload full benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: futurelab-v049-${{ github.run_id }}
          path: results/v49/inventory/
          if-no-files-found: warn
          retention-days: 30