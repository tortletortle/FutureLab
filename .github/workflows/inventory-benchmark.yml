name: FutureLab V0.47 inventory benchmark
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned benchmark dependencies
        run: python -m pip install -r requirements-v47.txt
      - name: Run regression and inventory state-machine tests
        run: python -m pytest -q
      - name: Download official UCI Online Retail II source
        run: |
          mkdir -p data/raw
          curl --fail --location --retry 3 --retry-delay 3 \
            'https://archive.ics.uci.edu/static/public/502/online+retail+ii.zip' \
            --output 'data/raw/online+retail+ii.zip'
          echo '572e36277c2390fbfde10664750731e0a86f55e33470d91919085f0408e67bfb  data/raw/online+retail+ii.zip' | sha256sum --check
      - name: Run chronological multi-period inventory benchmark
        run: python src/inventory_v47.py --data 'data/raw/online+retail+ii.zip' --output results/v47/remote-run
      - name: Independently audit inventory transitions and policy selection
        run: python src/audit_v47.py results/v47/remote-run
      - name: Upload run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: futurelab-v047-inventory-${{ github.run_id }}
          path: results/v47/remote-run/
          if-no-files-found: warn
          retention-days: 30
